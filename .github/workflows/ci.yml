name: quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile skills/mealie-quality-operator/scripts/audit_mealie.py
      - name: Verify valid fixture passes
        run: >-
          python skills/mealie-quality-operator/scripts/audit_mealie.py
          recipe tests/fixtures/valid-banana-oatmeal.json
          --policy skills/mealie-quality-operator/assets/policy.example.json
          --strict
      - name: Verify invalid fixture is blocked
        run: |
          set +e
          python skills/mealie-quality-operator/scripts/audit_mealie.py recipe tests/fixtures/invalid-empty-food.json --strict
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "invalid fixture returned $status; expected quality-gate exit code 1"
            exit 1
          fi
